#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_dcf_disability_accommodations
code: |
  # Set the allowed courts for this interview
  nav.set_section("review_dcf_disability_accommodations")
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  users.gather()
  set_parts(subtitle=str(users))
  is_diff_par_sched
  is_handson_learning_med
  is_translation_plainlanguage
  skills_shown
  adpt_braille
  trans_asl
  other_any_one
  DCF_region
  users[0].contact_other
  interview_order_dcf_disability_accommodations = True
---
###################### Main order ######################
comment: |
  This block includes the logic for standalone interviews.
  Delete mandatory: True to include in another interview
mandatory: True
code: |
  al_intro_screen
  dcf_disability_accommodations_intro
  interview_order_dcf_disability_accommodations
  signature_date
  # Store anonymous data for analytics / statistics
  store_variables_snapshot(
      persistent=True,
      data={
          "zip": showifdef("users[0].address.zip"),
          "reached_interview_end": True,
      },
  )
  dcf_disability_accommodations_download
---
id: DCF_disability_accommodations
continue button field: dcf_disability_accommodations_intro
question: |
  DCF disability accommodations
subquestion: |
  This interview will help you get a change in rules when talking with DCF.
  Please select any changes you need to better help you take care of your child or ward.

  If you are a disabled and a parent or caregiver, you can use this interview to get adjustments related to your disability to be able to care for your child or ward
---
id: time/place
question: |
  Do you need changes to your parenting schedule?
fields:
  - "A different parenting schedule": is_diff_par_sched
    datatype: yesno
  - "Longer parenting time": is_longer_par_time
    datatype: yesno
  - "Shorter parenting time": is_shorter_par_time
    datatype: yesno
  - "Different location for parenting time": is_diff_loc
    datatype: yesno
---
id: meetings
question: | 
  Do you need help with meetings or appointments?
fields:
  - "Hands on learning during appointments about child's medical or early intervention services appointments": is_handson_learning_med
    datatype: yesno
  - "Meeting notes during appointments": is_meeting_notes
    datatype: yesno
  - "To bring a plus one to meetings": is_plusone_meetings
    datatype: yesno
  - "Extra processing time during meetings, including breaks": is_extra_time
    datatype: yesno
    required: False
  - "A visual calendar for my appointments I can hang on my wall": is_visual_calendar
    datatype: yesno
  - "I need DCF to call or email me appointment reminders": is_appointment_reminders
    datatype: yesno
    required: False
  - "A written summary of any meeting with DCF or its contractors": is_written_summary
    datatype: yesno
  - "I need my meetings with the DCF to be virtual": is_virtual_meetings
    datatype: yesno
  - "Meeting materials preprepared": is_meeting_materials_preprepared
    datatype: yesno
---
question: |
   Do you need things to be easier to understand?
fields:
  - "DCF to translate the things they give me to plain language": is_translation_plainlanguage
    datatype: yesno
  - "Letters and DCF action plans to be written in an easier way to understand": is_change_letters_written_simpler
    datatype: yesno
---
question: | 
   Do you need a change in how you are taught parenting skills?
fields:
  - "I need parenting skills to be taught to me by being shown in my home": skills_shown
    datatype: yesno
  - "I need parenting skills to be taught to me through pictures rather than works for step-by-step instructions": skills_pictures
    datatype: yesno
---
question: | 
    Do you need any types of adaptive parenting equipment?
fields:
  - "I need Braille books as adaptive parenting equipment": adpt_braille
    datatype: yesno
  - "I need talking thermometers as adaptive parenting equipment": adpt_therm
    datatype: yesno
  - "I need a tactile medicine dispenser for easy access to medication as adaptive parenting equipment": adpt_med_disp
    datatype: yesno
  - "I need speech-to-text tools": adpt_speech_text
    datatype: yesno
  - "I need text-to-speech tools": adpt_text_speech
    datatype: yesno
  - "I need closed captioning during virtual meetings": adpt_cc
    datatype : yesno
---
question: |
   Do you need any translation services?
fields:
  - "I need an American Sign Language Interpreter": trans_asl
    datatype: yesno
  - "I need a Certified Deaf Interpreter": trans_cdi
    datatype: yesno
  - "I need a Communication Access Real-Time Translation (CART)": trans_cart
    datatype: yesno
---
  question: |
    Are there any other accomodations not already listed that you need?
  fields:
  - "Other accommodation not listed": other_any_one
    required: False
  - "Other accommodation not listed": other_any_two
    required: False
---
 question: |
  What DCF region do you live in?
 fields:
  - "What Dcf region do you live in?": DCF_region
    datatype: radio
    choices:
      - "Boston Region"
      - "Northern Region"
      - "Southern Region"
      - "Western Region"
      - "Central Region"
---
question: |
  How can DCF contact you?
fields:
  - "Your phone number": users[0].contact_phone
    datatype: number
    required: False
  - "Non-phone contact information": users[0].contact_other
    required: False
---
id: preview dcf_disability_accommodations
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_recipient_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_dcf_disability_accommodations'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: dcf_disability_accommodations_preview_question    
---
code: |
  signature_fields = []
---
