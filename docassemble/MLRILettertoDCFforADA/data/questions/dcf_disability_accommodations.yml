---
# ALDocument objects specify the metadata for each template
objects:
  - dcf_disability_accommodations_Post_interview_instructions: ALDocument.using(title="Next Steps", filename="Next_Steps_for_DCF_ADA_Request.docx", enabled=True, has_addendum=False)
  - dcf_disability_accommodations_attachment: ALDocument.using(title="DCF disability accommodations", filename="dcf_disability_accommodations", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[dcf_disability_accommodations_Post_interview_instructions, dcf_disability_accommodations_attachment], filename="dcf_disability_accommodations", title="All forms to download for your records", enabled=True)
  - al_recipient_bundle: ALDocumentBundle.using(elements=[dcf_disability_accommodations_attachment],  filename="dcf_disability_accommodations", title="All forms to file", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: Next_Steps_for_DCF_ADA_Request.docx
  docx template file: Next_Steps_for_DCF_ADA_Request.docx
  variable name: dcf_disability_accommodations_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
