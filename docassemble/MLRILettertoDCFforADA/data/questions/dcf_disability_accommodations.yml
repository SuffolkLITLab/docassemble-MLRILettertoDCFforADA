---
id: DCF_disability_accommodations
continue button field: dcf_disability_accommodations_intro
question: |
  DCF disability accommodations
subquestion: |
  This interview will help you get a change in rules when talking with DCF.
  Please select any changes you need to better help you take care of your child or ward.

  If you are a disabled and a parent or caregiver, you can use this interview to get adjustments related to your disability to be able to care for your child or ward
---
id: time/place
question: |
  Do you need changes to your parenting schedule?
progress: 10
fields:
  - "A different parenting schedule": is_diff_par_sched
    datatype: yesno
  - "Longer parenting time": is_longer_par_time
    datatype: yesno
  - "Shorter parenting time": is_shorter_par_time
    datatype: yesno
  - "Different location for parenting time": is_diff_loc
    datatype: yesno

---
id: meetings
question: | 
  Do you need help with meetings or appointments?
progress: 20
fields:
  - "Hands on learning during appointments about child's medical or early intervention services appointments": is_handson_learning_med
    datatype: yesno
  - "Meeting notes during appointments": is_meeting_notes
    datatype: yesno
  - "To bring a plus one to meetings": is_plusone_meetings
    datatype: yesno
  - "Extra processing time during meetings, including breaks": is_extra_time
    datatype: yesno
    required: False
  - "A visual calendar for my appointments I can hang on my wall": is_visual_calendar
    datatype: yesno
  - "I need DCF to call or email me appointment reminders": is_appointment_reminders
    datatype: yesno
    required: False
  - "A written summary of any meeting with DCF or its contractors": is_written_summary
    datatype: yesno
  - "I need my meetings with the DCF to be virtual": is_virtual_meetings
    datatype: yesno
  - "Meeting materials preprepared": is_meeting_materials_preprepared
    datatype: yesno
---
question: |
   Do you need things to be easier to understand?
progress: 30
fields:
  - "DCF to translate the things they give me to plain language": is_translation_plainlanguage
    datatype: yesno
  - "Letters and DCF action plans to be written in an easier way to understand": is_change_letters_written_simpler
    datatype: yesno
---
question: | 
   Do you need a change in how you are taught parenting skills?
progress: 40
fields:
  - "Yes, teach me by showing me the skills in my home": skills_shown
    datatype: yesno
  - "Yes, teach to me through pictures rather than works for step-by-step instructions": skills_pictures
    datatype: yesno
---
question: | 
    Do you need any types of adaptive parenting equipment?
progress: 50
fields:
  - "Braille books": adpt_braille
    datatype: yesno
  - "Talking thermometers": adpt_therm
    datatype: yesno
  - "Tactile medicine dispenser": adpt_med_disp
    datatype: yesno
  - "I need speech-to-text tools": adpt_speech_text
    datatype: yesno
  - "I need text-to-speech tools": adpt_text_speech
    datatype: yesno
  - "Closed captioning during virtual meetings": adpt_cc
    datatype : yesno
help:
  label: What is a tacticle medicine dispenser?
  heading: Tacticle medicine dispenser
  content: |
   A tactile medicine dispenser is a device that uses the sense of touch to help users, particularly those with visual impairments or limited dexterity, accurately dispense medication. This is often combined with audible and visual cues to ensure correct dosing and improved adherence to medication schedules
---
question: |
   Do you need any services for the hearing/speaking impaired?
progress: 60
fields:
  - "American Sign Language Interpreter": trans_asl
    datatype: yesno
  - "Certified Deaf Interpreter": trans_cdi
    datatype: yesno
  - "Communication Access Real-Time Translation (CART)": trans_cart
    datatype: yesno
help:
  label: Learn more about these services
  heading: What do those services mean?
  content: |
    An American Sign Language Interpreter is someone who knows both spoken english and ASL, who can translate for you, if you use ASL to communicate
   
    A certified deaf intrepreter is a someone who is a professional who works with an ASL interpreter to help deaf people communicate with the DCF with more than just translation
    
    Communication Access Real-Time Translation (CART) is a tool that automatically translates spoken words into written text to help with communication
---
  question: |
    Are there any other accomodations not already listed that you need
  progress: 70
  fields:
  - "Other accommodation not listed": other_any_one
    required: False
  - "Other accommodation not listed": other_any_two
    required: False
---
question: |
  What DCF region do you live in?
progress: 80
fields:
  - "What DCF region do you live in?": DCF_region
    datatype: radio
    choices:
      - "Boston Region"
      - "Northern Region"
      - "Southern Region"
      - "Western Region"
      - "Central Region"
help:
  label: Don't know your region?
  heading: What region am I in?
  content: |
      Your DCF region can be found on Mass.gov, <a target="_self" href="https://www.mass.gov/info-details/dcf-area-offices-by-citytown"> linked here</a>
---
question: |
  How can DCF contact you?
progress: 90
fields:
  - "Phone number": users[0].contact_phone
    required: True
  - "Non-phone contact information": users[0].contact_other
    required: False
---
